# Vue single-file components: the template's html, `{{ }}` and a
# directive's value read as typescript, a `<script>` by its `lang`
# (javascript unless it says ts, tsx or jsx), a `<style>` as css or scss.
# The queries are the repository's own, nvim's layout (`queries/vue`,
# with `html_tags` in front of them). Its `#lua-match?` predicates are
# not read by kawoosh: the patterns they guard match regardless.
extensions = ["vue"]
comment_block = ["<!--", "-->"]

