# templ: Go with html components (`templ Name() { <div>…</div> }`), css
# and script blocks. The grammar extends tree-sitter-go 0.25, and its
# queries say `; inherits: go`, a grammar kawoosh builds in rather than
# one of this repository's: so `queries/` holds them whole — go's
# highlights and tags in front of templ's — each file saying where its
# parts are from.
extensions = ["templ"]
comment = "//"
comment_block = ["/*", "*/"]

[source]
repo = "https://github.com/vrischmann/tree-sitter-templ"
